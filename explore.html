<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Explore</title>
    <link rel="stylesheet" href="style_ex.css" />
  </head>
  <body>
    <div class="content">
      <button class="back"><</button>
    <section class="input">
      <div class="input-box">
        <div class="status-bar">
          
          <div class="status-icons">
            <span></span>
            <span></span>
            <span></span>
          </div>
        </div>
       
        <div class="header-row">
          <h1 class="heading">Customize Your Journey</h1>
        </div>

        <div class="hero-card">
          <div class="plane-illustration"><img src="images/ex_within2.jpeg"></div>
        </div>

        <div class="travel-tabs">
          <button type="button" class="tab active" data-tab="season">Weather</button>
          <button type="button" class="tab" data-tab="type">Type</button>
          <button type="button" class="tab" data-tab="crowd">Crowd</button>
          
        </div>

        <div class="get_input">
          <select class="season" id="season" data-field="season">
            <option value="" selected disabled hidden>Choose a Weather</option>
            <option value="Sunny">Sunny</option>
            <option value="Hot">Hot</option>
            <option value="Rainy">Rainy</option>
            <option value="Snowy">Snowy</option>
            <option value="Pleasant">Pleasant</option>
          </select>

          <select class="type" id="type" data-field="type">
            <option value="" selected disabled hidden>Choose Type</option>
            
          </select>

           <select class="crowd" id="crowd" data-field="crowd">
            <option value="" selected disabled hidden>Choose Crowd</option>
           
          </select>
        </div>


        <div class="activities">
          <p>Activities:</p>
          <label><input type="checkbox" value="Sightseeing" /> Sightseeing</label>
          <label><input type="checkbox" value="Trekking" /> Trekking</label>
          <label><input type="checkbox" value="Food" /> Food</label>
          <label><input type="checkbox" value="Shopping" /> Shopping</label>
          <label><input type="checkbox" value="Adventure" /> Adventure</label>
          <label><input type="checkbox" value="Water Sports" /> Water Sports</label>
          <label><input type="checkbox" value="Cultural Experiences" /> Cultural Experiences</label>
        </div>

        <button type="button" class="search-btn">Search</button>
      </div>
      
    </section>
    <section class="show">
     <div class="results" id="results">
     </div>
    </section>
    </div>
    <script type="module" src="app_ex.js"></script>
  </body>
</html>

  </body>
</html>
