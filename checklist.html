<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checklist</title>
    <link rel="stylesheet" href="check_style.css">
</head>
<body>
   <a href="index.html"><button class="back"><</button></a>
    <div class="checklist-page">

    <div class="eyebrow">
    ✦ SMART TRAVEL COMPANION
</div>

<h1>My Travel Checklist</h1>

<p class="subtitle">
Never forget your essentials before every journey.
</p>
    
  <div class="progress-box">
    <div class="progress-circle">
    <span id="overallPercent">0%</span>
</div>
    <div class="progress-info">
      <h2>Overall Progress</h2>
      <p>0 of 21 tasks completed</p>

    </div>
  </div>

  <div class="checklist-grid">

    <div class="check-card packing">
      <div class="card-header">
       <h2>🎒 Packing Essentials</h2>

        <span id="pack">0/8</span>
      </div>

      <div class="check-item">
        <input type="checkbox">
        <label>Clothes</label>
      </div>

      <div class="check-item">
        <input type="checkbox">
        <label>Footwares</label>
      </div>

      <div class="check-item">
        <input type="checkbox">
        <label>Sunglasses</label>
      </div>

      <div class="check-item">
        <input type="checkbox">
        <label>Power Bank</label>
      </div>

      <div class="check-item">
        <input type="checkbox">
        <label>Charger</label>
      </div>
      
      <div class="check-item">
        <input type="checkbox">
        <label>Earphones</label>
      </div>
      
       <div class="check-item">
        <input type="checkbox">
        <label>Jacket/Sweater(Optional)</label>
      </div>
      <div class="check-item">
        <input type="checkbox">
        <label>Umbrella/Raincoats(Optional)</label>
      </div>
     
    </div>


    <div class="check-card documents">
      <div class="card-header">
       <h2>📄 Documents</h2>
        <span id="doc">0/6</span>
      </div>

      <div class="check-item">
        <input type="checkbox">
        <label>ID Proof</label>
      </div>

      <div class="check-item">
        <input type="checkbox">
        <label>Tickets</label>
      </div>

      <div class="check-item">
        <input type="checkbox">
        <label>Travel Insurance</label>
      </div>

      <div class="check-item">
        <input type="checkbox">
        <label>Passport/Visa(Optional)</label>
      </div>
      
      <div class="check-item">
        <input type="checkbox">
        <label>Credit/Debit Card</label>
      </div>

      <div class="check-item">
        <input type="checkbox">
        <label>Passport-size Photos</label>
      </div>
      
    </div>


    <div class="check-card health">
      <div class="card-header">
        <h2>🩺 Health & Safety</h2>
        <span id="fitness">0/4</span>
      </div>

      <div class="check-item">
        <input type="checkbox">
        <label>Medicines</label>
      </div>

      <div class="check-item">
        <input type="checkbox">
        <label>First Aid Kit</label>
      </div>

      <div class="check-item">
        <input type="checkbox">
        <label>Insect repellent</label>
      </div>

      <div class="check-item">
        <input type="checkbox">
        <label>ORS / electrolyte packets</label>
      </div>

      
    </div>


    <div class="check-card money">
      <div class="card-header">
       <h2>💳 Money & Essentials</h2>
        <span id="cash">0/3</span>
      </div>

      <div class="check-item">
        <input type="checkbox">
        <label>Cash</label>
      </div>

      <div class="check-item">
        <input type="checkbox">
        <label>Cards</label>
      </div>

      <div class="check-item">
        <input type="checkbox">
        <label>Universal Adapter</label>
      </div>

      
    </div>

  </div>

</div>
<script src="check.js"></script>
</body>
</html>
